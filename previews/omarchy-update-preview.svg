<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" rx="8" fill="#1a1a2e"/>
  <rect x="50" y="40" width="200" height="200" rx="4" fill="#0d1117" stroke="#44cc11" stroke-width="1"/>
  <rect x="60" y="50" width="180" height="180" rx="2" fill="#111122"/>
  <text x="150" y="100" text-anchor="middle" fill="#e6edf3" font-family="monospace" font-size="10">$</text>
  <text x="150" y="120" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="8">pacman -Sy firefox</text>
  <text x="150" y="140" text-anchor="middle" fill="#888" font-family="monospace" font-size="8">:: Synchronizing package databases...</text>
  <text x="150" y="155" text-anchor="middle" fill="#888" font-family="monospace" font-size="8">:: Updating AUR...</text>
  <text x="150" y="170" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="8">:: firefox updated!</text>
  <rect x="70" y="190" width="160" height="30" rx="4" fill="#333355"/>
  <text x="150" y="210" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="9">firefox updated successfully</text>
  <text x="420" y="70" text-anchor="middle" fill="#e6edf3" font-family="monospace" font-size="20" font-weight="bold">Omarchy Plugin</text>
  <text x="420" y="95" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="14" font-weight="bold">Update App Under Cursor</text>
  <text x="420" y="130" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">SUPER + Right-click any window</text>
  <text x="420" y="150" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">Auto-detects app from process</text>
  <text x="420" y="170" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">pacman / yay / flatpak / snap</text>
  <text x="420" y="190" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">Works in terminals, browsers, apps</text>
  <line x1="340" y1="215" x2="500" y2="215" stroke="#44cc11" stroke-width="1" opacity="0.3"/>
  <text x="420" y="240" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="9" opacity="0.6">Shell | Hyprland | QML</text>
</svg>
