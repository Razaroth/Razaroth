<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (transparent) -->
  <rect width="400" height="120" rx="8" fill="none"/>

  <!-- Left accent line -->
  <line x1="20" y1="25" x2="20" y2="95" stroke="#44cc11" stroke-width="2" opacity="0.6"/>

  <!-- R icon mark -->
  <text x="55" y="78" text-anchor="middle" fill="#44cc11" font-family="monospace" font-size="42" font-weight="bold" filter="url(#glow)">R</text>

  <!-- Vertical separator -->
  <line x1="80" y1="35" x2="80" y2="85" stroke="#44cc11" stroke-width="1" opacity="0.3"/>

  <!-- Username -->
  <text x="95" y="62" fill="#e0e0e0" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="4">RAZAROTH</text>

  <!-- Tagline -->
  <text x="95" y="82" fill="#44cc11" font-family="monospace" font-size="10" opacity="0.7" letter-spacing="2">IT PROFESSIONAL / PROGRAMMER</text>

  <!-- Bottom accent line -->
  <line x1="95" y1="90" x2="380" y2="90" stroke="#44cc11" stroke-width="1" opacity="0.2"/>

  <!-- Small decorative dots -->
  <circle cx="370" cy="45" r="2" fill="#44cc11" opacity="0.3"/>
  <circle cx="380" cy="55" r="1.5" fill="#44cc11" opacity="0.2"/>
  <circle cx="375" cy="65" r="1" fill="#44cc11" opacity="0.15"/>
</svg>
